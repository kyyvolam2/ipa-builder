name: Build Assets.car on macOS
run-name: "tfm-assets-${{ inputs.asset_id }}"

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Correlation id generated by TestFlight Manager
        required: true
        type: string
      source_url:
        description: Short-lived HTTPS URL for the generated xcassets archive
        required: true
        type: string
      source_sha256:
        description: SHA-256 of the xcassets archive
        required: true
        type: string
      minimum_ios:
        description: Minimum iOS deployment target
        required: true
        default: '15.0'
        type: string

jobs:
  build-assets-car:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      contents: read
    steps:
      - name: Validate request
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          MINIMUM_IOS: ${{ inputs.minimum_ios }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ASSET_ID" =~ ^[a-f0-9]{32}$ ]] || { echo 'Invalid asset id.' >&2; exit 2; }
          [[ "$SOURCE_URL" == https://* && "$SOURCE_URL" != *$' '* && "$SOURCE_URL" != *$'\n'* ]] || { echo 'Invalid source URL.' >&2; exit 2; }
          [[ "$SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'Invalid source digest.' >&2; exit 2; }
          [[ "$MINIMUM_IOS" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?$ ]] || { echo 'Invalid deployment target.' >&2; exit 2; }
          [[ -d "$DEVELOPER_DIR" ]] || { echo 'Configured Xcode is unavailable on this runner.' >&2; exit 2; }

      - name: Download generated catalog
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 300 --max-filesize 67108864 "$SOURCE_URL" -o "$RUNNER_TEMP/catalog.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/catalog.zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/catalog"
          mkdir -p "$RUNNER_TEMP/catalog"
          python3 - "$RUNNER_TEMP/catalog.zip" "$RUNNER_TEMP/catalog" <<'PY'
          import pathlib, shutil, sys, zipfile
          archive, destination = map(pathlib.Path, sys.argv[1:])
          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              if not entries or len(entries) > 256:
                  raise SystemExit('Catalog has too many entries.')
              seen, total = set(), 0
              for info in entries:
                  name = info.filename.replace('\\', '/')
                  parts = name.split('/')
                  if (not name or name.startswith('/') or any(p in {'', '.', '..'} for p in parts[:-1])
                          or name in seen or info.flag_bits & 1
                          or ((info.external_attr >> 16) & 0o170000) == 0o120000):
                      raise SystemExit('Unsafe catalog path.')
                  seen.add(name)
                  total += info.file_size
                  if total > 64 * 1024 * 1024:
                      raise SystemExit('Catalog is too large.')
                  if info.compress_size and info.file_size > info.compress_size * 1000 + 1024 * 1024:
                      raise SystemExit('Catalog compression ratio is unsafe.')
                  target = (destination / pathlib.PurePosixPath(name)).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise SystemExit('Catalog path escapes destination.')
                  if name.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  if info.file_size > 16 * 1024 * 1024:
                      raise SystemExit('Catalog entry is too large.')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with source.open(info) as inp, target.open('wb') as out:
                      shutil.copyfileobj(inp, out, 1024 * 1024)
          PY
          if [[ ! -d "$RUNNER_TEMP/catalog/Assets.xcassets" ]]; then
            echo 'Generated catalog is missing Assets.xcassets.' >&2
            exit 2
          fi

      - name: Compile Assets.car with Xcode
        env:
          MINIMUM_IOS: ${{ inputs.minimum_ios }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/compiled"
          xcrun actool "$RUNNER_TEMP/catalog/Assets.xcassets" \
            --compile "$RUNNER_TEMP/compiled" \
            --platform iphoneos \
            --minimum-deployment-target "$MINIMUM_IOS" \
            --app-icon AppIcon \
            --output-partial-info-plist "$RUNNER_TEMP/compiled/partial.plist" \
            --output-format human-readable-text \
            --notices --warnings
          [[ -f "$RUNNER_TEMP/compiled/Assets.car" ]] || { echo 'actool did not produce Assets.car.' >&2; exit 3; }
          [[ -f "$RUNNER_TEMP/compiled/partial.plist" ]] || { echo 'actool did not produce partial Info.plist.' >&2; exit 3; }
          CAR_BYTES="$(wc -c < "$RUNNER_TEMP/compiled/Assets.car")"
          [[ "$CAR_BYTES" -ge 32 && "$CAR_BYTES" -le 1073741824 ]] || { echo 'Assets.car size is outside the safe limit.' >&2; exit 3; }
          [[ "$(head -c 8 "$RUNNER_TEMP/compiled/Assets.car")" == BOMStore ]] || { echo 'Assets.car has an invalid CoreUI header.' >&2; exit 3; }

      - name: Package Assets.car
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/artifact"
          cp "$RUNNER_TEMP/compiled/Assets.car" "$RUNNER_TEMP/artifact/Assets.car"

      - name: Upload Assets.car artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-car-${{ inputs.asset_id }}
          path: ${{ runner.temp }}/artifact/Assets.car
          if-no-files-found: error
          retention-days: 1

