name: Export unsigned IPA
run-name: "tfm-export-${{ inputs.export_id }}"

on:
  workflow_dispatch:
    inputs:
      export_id:
        description: TestFlight Manager export id
        required: true
        type: string
      scheme:
        description: Xcode scheme
        required: false
        type: string
      project:
        description: Optional .xcodeproj path
        required: false
        type: string
      workspace:
        description: Optional .xcworkspace path
        required: false
        type: string
      configuration:
        description: Xcode configuration
        required: true
        default: Release
        type: string
      source_url:
        description: Short-lived HTTPS URL for an uploaded source ZIP
        required: false
        type: string
      source_name:
        description: Uploaded source archive name
        required: false
        type: string
      source_sha256:
        description: SHA-256 of the uploaded source archive
        required: false
        type: string
      build_system:
        description: Build system (xcode or gradle)
        required: false
        default: xcode
        type: string
      gradle_task:
        description: Gradle task used for RoboVM IPA export
        required: false
        default: ios:createIPA
        type: string

jobs:
  export:
    # This workflow intentionally produces an unsigned artifact. It is not a
    # TestFlight upload and must be signed by a separate trusted pipeline.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPORT_ID: ${{ inputs.export_id }}
      BUILD_SYSTEM: ${{ inputs.build_system }}
      GRADLE_TASK: ${{ inputs.gradle_task }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Validate export request
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPORT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo 'Invalid export id.' >&2; exit 2; }
          BUILD_SYSTEM="${BUILD_SYSTEM:-xcode}"
          GRADLE_TASK="${GRADLE_TASK:-ios:createIPA}"
          [[ "$BUILD_SYSTEM" == xcode || "$BUILD_SYSTEM" == gradle ]] || { echo 'Build system must be xcode or gradle.' >&2; exit 2; }
          [[ "$GRADLE_TASK" =~ ^[A-Za-z0-9_.:-]{1,128}$ ]] || { echo 'Invalid Gradle task.' >&2; exit 2; }
          [[ -d "$DEVELOPER_DIR" ]] || { echo 'Configured Xcode is unavailable on this runner.' >&2; exit 2; }
          xcodebuild -version
          xcodebuild -showsdks

      - name: Set up Java for RoboVM
        if: ${{ inputs.build_system == 'gradle' }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Check out source
        if: ${{ inputs.source_url == '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download uploaded source archive
        if: ${{ inputs.source_url != '' }}
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          BUILD_SYSTEM: ${{ inputs.build_system }}
          PROJECT_INPUT: ${{ inputs.project }}
          WORKSPACE_INPUT: ${{ inputs.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_URL" == https://* && "$SOURCE_URL" != *$'\n'* && "$SOURCE_URL" != *$' '* ]] || { echo 'Invalid source URL.' >&2; exit 2; }
          [[ "$SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'Invalid source digest.' >&2; exit 2; }
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 900 "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/source.zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          python3 - "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/source" <<'PY'
          import os, pathlib, re, shutil, sys, zipfile
          archive, destination = map(pathlib.Path, sys.argv[1:])
          max_entries, max_total, max_file, max_ratio = 200000, 8 * 1024**3, 512 * 1024**2, 1000
          seen, total = set(), 0
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if not infos or len(infos) > max_entries:
                  raise SystemExit('Source archive contains too many entries.')
              for info in infos:
                  name = info.filename.replace('\\', '/')
                  parts = name.split('/')
                  if (not name or name.startswith('/') or ':' in parts[0] or '\x00' in name
                          or any(part in {'', '.', '..'} for part in parts[:-1]) or name in seen
                          or info.flag_bits & 0x1):
                      raise SystemExit('Unsafe, encrypted or duplicate source archive path.')
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Source archive symlinks are not allowed.')
                  seen.add(name)
                  total += info.file_size
                  if info.file_size > max_file or total > max_total:
                      raise SystemExit('Source archive is too large.')
                  if info.compress_size and info.file_size > info.compress_size * max_ratio + 1024 * 1024:
                      raise SystemExit('Source archive compression ratio is unsafe.')
                  target = (destination / pathlib.PurePosixPath(name)).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise SystemExit('Source archive path escapes extraction directory.')
                  if name.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as source, target.open('wb') as output:
                      shutil.copyfileobj(source, output, 1024 * 1024)
          def set_env(name, value):
              if '\r' in value or '\n' in value or '\x00' in value:
                  raise SystemExit('Build path contains unsupported control characters.')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  output.write(f'{name}={value}\n')

          build_system = os.environ.get('BUILD_SYSTEM') or 'xcode'
          if build_system == 'gradle':
              wrappers = [path for path in destination.rglob('gradlew')
                          if path.is_file() and not path.is_symlink()
                          and any((path.parent / name).is_file() for name in
                                  ('build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts'))
                          and any((path.parent / 'ios' / name).is_file() for name in
                                  ('build.gradle', 'build.gradle.kts'))
                          and (path.parent / 'gradle/wrapper/gradle-wrapper.jar').is_file()
                          and (path.parent / 'gradle/wrapper/gradle-wrapper.properties').is_file()]
              # A source ZIP must have one unambiguous Gradle wrapper. The
              # parent is recorded so projects wrapped in a top-level folder
              # build from their own root without trusting user input paths.
              if len(wrappers) != 1:
                  raise SystemExit('Uploaded source must contain exactly one Gradle wrapper (gradlew).')
              set_env('SOURCE_ROOT', wrappers[0].parent.relative_to(destination).as_posix())
          else:
              project = os.environ.get('PROJECT_INPUT', '')
              workspace = os.environ.get('WORKSPACE_INPUT', '')
              for selected in (project, workspace):
                  if selected:
                      if (not re.fullmatch(r'[A-Za-z0-9_ ./-]{1,255}', selected)
                              or any(part in ('', '.', '..') for part in selected.split('/'))):
                          raise SystemExit('Selected Xcode path is not a safe relative path.')
                      path = destination / selected
                      if not path.is_dir() or path.is_symlink() or not path.resolve().is_relative_to(destination.resolve()):
                          raise SystemExit(f'Selected Xcode path is not a directory: {selected}')
              if not project and not workspace:
                  candidates = []
                  for path in destination.rglob("*.xcodeproj"):
                      if (path / "project.pbxproj").is_file(): candidates.append(("project", path.relative_to(destination).as_posix()))
                  for path in destination.rglob("*.xcworkspace"):
                      if not any(parent.name.endswith('.xcodeproj') for parent in path.parents) and (path / "contents.xcworkspacedata").is_file():
                          candidates.append(("workspace", path.relative_to(destination).as_posix()))
                  if len(candidates) != 1:
                      raise SystemExit('Uploaded source must contain exactly one selectable Xcode project or workspace.')
                  set_env('SOURCE_PROJECT' if candidates[0][0] == 'project' else 'SOURCE_WORKSPACE', candidates[0][1])
          PY
          unset SOURCE_URL SOURCE_SHA256

      # Add project-specific dependency installation here, before archiving.
      # For CocoaPods, commit Podfile.lock and select the generated workspace.

      - name: Build without code signing (Xcode)
        if: ${{ inputs.build_system != 'gradle' }}
        env:
          SCHEME: ${{ inputs.scheme }}
          PROJECT_INPUT: ${{ inputs.project }}
          WORKSPACE_INPUT: ${{ inputs.workspace }}
          CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT="${PROJECT_INPUT:-${SOURCE_PROJECT:-}}"
          WORKSPACE="${WORKSPACE_INPUT:-${SOURCE_WORKSPACE:-}}"
          [[ -n "$SCHEME" && -n "$CONFIGURATION" ]] || { echo 'Scheme and configuration are required.' >&2; exit 2; }
          [[ -z "$PROJECT" || -z "$WORKSPACE" ]] || { echo 'Select project OR workspace.' >&2; exit 2; }
          if [[ -n "${SOURCE_URL:-}" || -f "$RUNNER_TEMP/source.zip" ]]; then
            [[ -d "$RUNNER_TEMP/source" ]] || { echo 'Uploaded source was not extracted.' >&2; exit 2; }
            [[ -z "$PROJECT" || -e "$RUNNER_TEMP/source/$PROJECT" ]] || { echo 'Project path is missing from source ZIP.' >&2; exit 2; }
            [[ -z "$WORKSPACE" || -e "$RUNNER_TEMP/source/$WORKSPACE" ]] || { echo 'Workspace path is missing from source ZIP.' >&2; exit 2; }
            cd "$RUNNER_TEMP/source"
          fi
          args=(-scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk iphoneos
            -destination 'generic/platform=iOS'
            -archivePath "$RUNNER_TEMP/export.xcarchive"
            -derivedDataPath "$RUNNER_TEMP/derived-data"
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 'CODE_SIGN_IDENTITY=')
          if [[ -n "$WORKSPACE" ]]; then
            args=(-workspace "$WORKSPACE" "${args[@]}")
          elif [[ -n "$PROJECT" ]]; then
            args=(-project "$PROJECT" "${args[@]}")
          else
            echo 'Set project or workspace in the Export IPA form.' >&2
            exit 2
          fi
          xcodebuild archive "${args[@]}"
          python3 <<'PY'
          import os
          import pathlib
          import plistlib
          import shutil

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          applications = temp / 'export.xcarchive/Products/Applications'
          apps = [path for path in applications.glob('*.app') if path.is_dir() and not path.is_symlink()]
          if len(apps) != 1:
              raise SystemExit(f'Expected exactly one archived .app, found {len(apps)}. Check the shared scheme archive targets.')
          with (apps[0] / 'Info.plist').open('rb') as stream:
              info = plistlib.load(stream)
          if info.get('CFBundlePackageType') != 'APPL' or 'iPhoneOS' not in info.get('CFBundleSupportedPlatforms', []):
              raise SystemExit('Archive must contain an iOS device application, not a simulator application.')
          payload = temp / 'ipa/Payload'
          payload.mkdir(parents=True, exist_ok=False)
          shutil.copytree(apps[0], payload / apps[0].name, symlinks=True)
          PY
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/unsigned-${EXPORT_ID}.ipa" Payload)

      - name: Grant execute permission for gradlew
        if: ${{ inputs.build_system == 'gradle' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE"
          if [[ -f "$RUNNER_TEMP/source.zip" ]]; then
            ROOT="$RUNNER_TEMP/source/${SOURCE_ROOT:-}"
          fi
          [[ -d "$ROOT" ]] || { echo 'Gradle project root is missing.' >&2; exit 2; }
          [[ -f "$ROOT/gradlew" && ! -L "$ROOT/gradlew" ]] || { echo 'Gradle wrapper gradlew was not found.' >&2; exit 2; }
          python3 - "$ROOT/gradlew" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          path.write_bytes(path.read_bytes().replace(b'\r\n', b'\n'))
          PY
          chmod +x "$ROOT/gradlew"

      - name: Build IPA with RoboVM
        if: ${{ inputs.build_system == 'gradle' }}
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE"
          if [[ -f "$RUNNER_TEMP/source.zip" ]]; then
            ROOT="$RUNNER_TEMP/source/${SOURCE_ROOT:-}"
          fi
          cd "$ROOT"
          TASK="${GRADLE_TASK:-ios:createIPA}"
          [[ "$TASK" =~ ^[A-Za-z0-9_.:-]{1,128}$ ]] || { echo 'Invalid Gradle task.' >&2; exit 2; }
          # ZIPs made on development machines can include old build results.
          # Only an IPA created by this invocation may become the artifact.
          python3 <<'PY'
          import pathlib
          for output in pathlib.Path('ios/build/robovm').glob('*.ipa'):
              if output.is_file() or output.is_symlink():
                  output.unlink()
          PY
          ./gradlew "$TASK" --stacktrace -Probovm.iosSkipSigning=true -Probovm.archs=arm64
          python3 <<'PY'
          import os, pathlib, plistlib, shutil, zipfile
          artifacts = [path for path in pathlib.Path('ios/build/robovm').glob('*.ipa')
                       if path.is_file() and not path.is_symlink()]
          if len(artifacts) != 1:
              raise SystemExit(f'Expected exactly one new IPA in ios/build/robovm, found {len(artifacts)}.')
          with zipfile.ZipFile(artifacts[0]) as ipa:
              infos = [name for name in ipa.namelist()
                       if len(pathlib.PurePosixPath(name).parts) == 3 and name.startswith('Payload/')
                       and pathlib.PurePosixPath(name).parts[1].endswith('.app') and name.endswith('/Info.plist')]
              if len(infos) != 1:
                  raise SystemExit('RoboVM output must contain exactly one iOS application under Payload.')
              info = plistlib.loads(ipa.read(infos[0]))
              if info.get('CFBundlePackageType') != 'APPL' or 'iPhoneOS' not in info.get('CFBundleSupportedPlatforms', []):
                  raise SystemExit('RoboVM output must be an iOS device IPA, not a simulator application.')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / ('unsigned-' + os.environ['EXPORT_ID'] + '.ipa')
          shutil.copyfile(artifacts[0], target)
          PY

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-ipa-${{ inputs.export_id }}
          path: ${{ runner.temp }}/unsigned-${{ inputs.export_id }}.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
